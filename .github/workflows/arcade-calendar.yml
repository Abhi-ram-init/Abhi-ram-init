name: Arcade Block Contribution Calendar

on:
  schedule:
    - cron: "0 */6 * * *"   # Refresh every 6 hours with live GitHub contribution data
  workflow_dispatch:        # Allow manual run anytime
  push:
    branches:
      - main
    paths-ignore:
      - "assets/arcade-contributions.svg"

permissions:
  contents: write

jobs:
  update-arcade-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate real-time arcade block calendar SVG
        run: python .github/generators/generate_arcade_calendar.py --user "${{ github.repository_owner }}" --out assets/arcade-contributions.svg

      - name: Commit updated SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet assets/arcade-contributions.svg; then
            git add assets/arcade-contributions.svg
            git commit -m "chore: refresh live arcade block contribution calendar"
            git pull --rebase origin main || true
            git push
          else
            echo "Contribution calendar is already up to date."
          fi
