<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="100%">
  <defs>
    <!-- Gradients & Glow Filters -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="paddleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="brickGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .arcade-bg { fill: #0b0f19; stroke: url(#borderGrad); stroke-width: 2px; }
      .crt-lines { fill: none; stroke: rgba(255, 255, 255, 0.03); stroke-width: 1px; }
      
      .hud-title { font-family: 'Press Start 2P', monospace, sans-serif; font-size: 11px; fill: #00f5ff; letter-spacing: 1px; }
      .hud-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #a0aec0; }
      .hud-score { font-family: 'Press Start 2P', monospace; font-size: 10px; fill: #ff007f; }
      .hud-legend { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #718096; }
      
      /* RGB Brick Palette */
      .b-0 { fill: #151d2d; }
      .b-cyan { fill: #00f5ff; filter: url(#brickGlow); }
      .b-lime { fill: #39ff14; filter: url(#brickGlow); }
      .b-amber { fill: #ffb700; filter: url(#brickGlow); }
      .b-pink { fill: #ff007f; filter: url(#brickGlow); }

      /* Falling Brick Animations */
      @keyframes fall1 {
        0% { transform: translateY(-80px); opacity: 0; }
        40% { opacity: 1; }
        70% { transform: translateY(0px); }
        85% { transform: translateY(-6px); }
        100% { transform: translateY(0px); opacity: 1; }
      }
      @keyframes fall2 {
        0%, 15% { transform: translateY(-80px); opacity: 0; }
        55% { opacity: 1; }
        80% { transform: translateY(0px); }
        90% { transform: translateY(-5px); }
        100% { transform: translateY(0px); opacity: 1; }
      }
      @keyframes fall3 {
        0%, 30% { transform: translateY(-80px); opacity: 0; }
        70% { opacity: 1; }
        88% { transform: translateY(0px); }
        95% { transform: translateY(-4px); }
        100% { transform: translateY(0px); opacity: 1; }
      }
      @keyframes fall4 {
        0%, 45% { transform: translateY(-80px); opacity: 0; }
        80% { opacity: 1; }
        92% { transform: translateY(0px); }
        97% { transform: translateY(-3px); }
        100% { transform: translateY(0px); opacity: 1; }
      }

      .falling-1 { animation: fall1 4s ease-out infinite; }
      .falling-2 { animation: fall2 4.5s ease-out infinite; }
      .falling-3 { animation: fall3 5s ease-out infinite; }
      .falling-4 { animation: fall4 5.5s ease-out infinite; }

      /* Arcade Paddle & Ball Motion */
      @keyframes paddleMove {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(280px); }
      }
      @keyframes ballMove {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(140px, -60px); }
        50% { transform: translate(280px, -5px); }
        75% { transform: translate(140px, -70px); }
        100% { transform: translate(0px, 0px); }
      }

      .paddle { animation: paddleMove 6s ease-in-out infinite; }
      .ball { animation: ballMove 6s ease-in-out infinite; fill: #ffffff; filter: url(#neonGlow); }
    </style>
  </defs>

  <!-- Screen Frame -->
  <rect x="2" y="2" width="836" height="236" rx="10" class="arcade-bg" />

  <!-- CRT Scanlines Overlay -->
  <path d="M10,25 H830 M10,50 H830 M10,75 H830 M10,100 H830 M10,125 H830 M10,150 H830 M10,175 H830 M10,200 H830" class="crt-lines" />

