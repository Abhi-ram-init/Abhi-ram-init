<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 28" width="100%" role="img" aria-label="Section Divider">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#04A2DC" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#4DD0FF" stop-opacity="0.95"/>
      <stop offset="65%"  stop-color="#04A2DC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>

    <style><![CDATA[
      @keyframes corePulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      .core { animation: corePulse 2.4s ease-in-out infinite; }
    ]]></style>
  </defs>

  <!-- Wide margins so lines and endpoint nodes never overlap centered text -->
  <line x1="20"  y1="14" x2="262" y2="14" stroke="url(#divLine)" stroke-width="1.5"/>
  <line x1="558" y1="14" x2="800" y2="14" stroke="url(#divLine)" stroke-width="1.5"/>

  <rect x="272" y="11.5" width="5" height="5" rx="1" fill="#38BDF8" opacity="0.75"/>
  <rect x="543" y="11.5" width="5" height="5" rx="1" fill="#38BDF8" opacity="0.75"/>

  <text x="410" y="17.5" text-anchor="middle"
    font-family="'Courier New', Consolas, monospace"
    font-size="10" font-weight="700" letter-spacing="1.8" fill="#4DD0FF" class="core"
  >BUILD · LEARN · REPEAT</text>
</svg>
