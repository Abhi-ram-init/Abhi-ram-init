<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 165" width="100%">
  <defs>
    <!-- BG gradient — deep midnight asphalt -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#04080f"/>
      <stop offset="100%" stop-color="#0d1a26"/>
    </linearGradient>

    <!-- Speed streak gradient — Forza gold / NFS amber -->
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFB400" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#FFB400" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#FF8C00" stop-opacity="0.65"/>
      <stop offset="85%"  stop-color="#FF6B00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>

    <!-- Name text gradient — bright white → off-white -->
    <linearGradient id="namec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8D8E8"/>
    </linearGradient>

    <!-- Bottom accent bar gradient -->
    <linearGradient id="acbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#FF8C00"/>
      <stop offset="80%"  stop-color="#FFB400"/>
      <stop offset="100%" stop-color="#FFB400" stop-opacity="0"/>
    </linearGradient>

    <!-- White glow behind name -->
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gold halo behind name shadow -->
    <filter id="goldHalo" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>

    <!-- clip speed lines to SVG bounds -->
    <clipPath id="svgclip">
      <rect width="820" height="165" rx="12"/>
    </clipPath>

    <style>
      /* ── Speed line sweep ── */
      @keyframes sweep {
        0%   { transform: translateX(-820px); }
        100% { transform: translateX(820px); }
      }

      /* ── Name entrance: letters spread from centre, opacity in ── */
      @keyframes nameIn {
        0%   { opacity: 0; letter-spacing: 28px; }
        55%  { opacity: 1; letter-spacing: 7px;  }
        100% { opacity: 1; letter-spacing: 7px;  }
      }

      /* ── Tagline entrance: fade up ── */
      @keyframes tagIn {
        0%,38% { opacity: 0; transform: translateY(8px); }
        75%,100%{ opacity: 1; transform: translateY(0);  }
      }

      /* ── Gold bar pulse ── */
      @keyframes barPulse {
        0%,100% { opacity: 0.5; }
        50%     { opacity: 1;   }
      }

      /* ── Left chevrons slide ── */
      @keyframes chL {
        0%,100% { opacity: 0.2; transform: translateX(0);   }
        50%     { opacity: 0.8; transform: translateX(-7px); }
      }

      /* ── Right chevrons slide ── */
      @keyframes chR {
        0%,100% { opacity: 0.2; transform: translateX(0);  }
        50%     { opacity: 0.8; transform: translateX(7px); }
      }

      /* ── Corner bracket blink ── */
      @keyframes blink {
        0%,100% { opacity: 0.15; }
        50%     { opacity: 0.55; }
      }

      .s1 { animation: sweep 2.1s linear infinite; }
      .s2 { animation: sweep 2.1s linear infinite .30s; }
      .s3 { animation: sweep 2.6s linear infinite .05s; }
      .s4 { animation: sweep 1.9s linear infinite .55s; }
      .s5 { animation: sweep 2.4s linear infinite .80s; }
      .s6 { animation: sweep 2.9s linear infinite .40s; }
      .s7 { animation: sweep 2.1s linear infinite 1.1s; }
      .s8 { animation: sweep 2.4s linear infinite .15s; }

      .n   { animation: nameIn 1.3s cubic-bezier(.16,1,.3,1) forwards; }
      .tag { animation: tagIn  2.0s ease-out forwards; }
      .bar { animation: barPulse 2.6s ease-in-out infinite; }
      .chl { animation: chL 2.2s ease-in-out infinite; }
      .chr { animation: chR 2.2s ease-in-out infinite; }
      .brk { animation: blink 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ── Background ── -->
  <rect width="820" height="165" rx="12" fill="url(#bg)"/>

  <!-- ── Subtle horizontal centre glow (road reflection) ── -->
  <ellipse cx="410" cy="82" rx="380" ry="45" fill="#FFB400" opacity="0.04"/>

  <!-- ── Speed streak lines ── -->
  <g clip-path="url(#svgclip)">
    <rect class="s1" x="0" y="34"  width="820" height="1.5" fill="url(#streak)"/>
    <rect class="s2" x="0" y="47"  width="820" height="2.5" fill="url(#streak)"/>
    <rect class="s3" x="0" y="58"  width="820" height="1"   fill="url(#streak)"/>
    <rect class="s4" x="0" y="70"  width="820" height="3.5" fill="url(#streak)"/>
    <rect class="s5" x="0" y="82"  width="820" height="1.5" fill="url(#streak)"/>
    <rect class="s6" x="0" y="93"  width="820" height="2"   fill="url(#streak)"/>
    <rect class="s7" x="0" y="104" width="820" height="1"   fill="url(#streak)"/>
    <rect class="s8" x="0" y="115" width="820" height="2.5" fill="url(#streak)"/>
  </g>

  <!-- ── Top-left NFS-style corner bracket ── -->
  <text class="brk" x="12" y="28"
    font-family="monospace" font-size="14" fill="#FFB400" letter-spacing="1"
  >[ PLAYER_01 ]</text>

  <!-- ── Top-right race tag ── -->
  <text class="brk" x="680" y="28"
    font-family="monospace" font-size="14" fill="#FFB400" letter-spacing="1"
  >[ VVCE · 2029 ]</text>

  <!-- ── Left speed chevrons ── -->
  <text class="chl" x="14" y="100"
    font-family="monospace" font-size="52" font-weight="900" fill="#FFB400"
  >»</text>

  <!-- ── Right speed chevrons ── -->
  <text class="chr" x="762" y="100"
    font-family="monospace" font-size="52" font-weight="900" fill="#FFB400"
  >«</text>

  <!-- ── Gold halo shadow behind name ── -->
  <text x="410" y="100" text-anchor="middle"
    font-family="'Arial Black', Impact, 'Haettenschweiler', 'Franklin Gothic Heavy', sans-serif"
    font-size="58" font-weight="900" font-style="italic"
    fill="#FFB400" opacity="0.28"
    filter="url(#goldHalo)"
    letter-spacing="7"
  >ABHIRAM B S</text>

  <!-- ── Main name text ── -->
  <text class="n" x="410" y="100" text-anchor="middle"
    font-family="'Arial Black', Impact, 'Haettenschweiler', 'Franklin Gothic Heavy', sans-serif"
    font-size="58" font-weight="900" font-style="italic"
    fill="url(#namec)"
    filter="url(#glow)"
    letter-spacing="7"
  >ABHIRAM B S</text>

  <!-- ── Bottom gold accent bar ── -->
  <rect class="bar" x="210" y="116" width="400" height="2.5" rx="1.5" fill="url(#acbar)"/>

  <!-- ── Tagline ── -->
  <text class="tag" x="410" y="143" text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5" letter-spacing="4" fill="#FFB400" opacity="0.92"
  >SYSTEMS EXPLORER  ·  VIBECODER  →  SPEC-DRIVEN BUILDER</text>
</svg>
