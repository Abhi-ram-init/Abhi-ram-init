<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 148" width="100%" role="img" aria-label="Abhiram B S — Computer and Game HUD Console">
  <defs>
    <linearGradient id="hudBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#070C17"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="50%"  stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="trackFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F5A76"/>
      <stop offset="55%"  stop-color="#04A2DC"/>
      <stop offset="100%" stop-color="#4DD0FF"/>
    </linearGradient>

    <!-- Strict boundary clip inside the progress bar track so animation can NEVER overflow -->
    <clipPath id="progClip">
      <rect x="304" y="70" width="212" height="8" rx="2"/>
    </clipPath>

    <style><![CDATA[
      .mono { font-family: 'Courier New', Consolas, monospace; }

      @keyframes ledPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.32; }
      }
      @keyframes cursorBlink {
        0%, 49%  { opacity: 1; }
        50%, 100%{ opacity: 0; }
      }
      @keyframes pulseBar {
        0%   { transform: translateX(-28px); }
        100% { transform: translateX(220px); }
      }

      .led      { animation: ledPulse 2s ease-in-out infinite; }
      .cursor   { animation: cursorBlink 1.1s step-end infinite; }
      .scanner  { animation: pulseBar 2.8s linear infinite; }
    ]]></style>
  </defs>

  <!-- Main Console Shell -->
  <rect x="0" y="0" width="820" height="148" rx="10" fill="url(#hudBg)"/>
  <rect x="0.75" y="0.75" width="818.5" height="146.5" rx="9.5" fill="none" stroke="#17253B" stroke-width="1.2"/>
  <rect x="1" y="1" width="818" height="2" rx="1" fill="url(#cyanAccent)"/>

  <!-- Window Title Bar -->
  <rect x="16" y="15" width="7" height="7" rx="1.5" fill="#4DD0FF" class="led"/>
  <rect x="27" y="15" width="7" height="7" rx="1.5" fill="#04A2DC" opacity="0.75"/>
  <rect x="38" y="15" width="7" height="7" rx="1.5" fill="#0F5A76" opacity="0.85"/>
  <text x="55" y="21.5" class="mono" font-size="10.5" font-weight="700" fill="#F1F5F9" letter-spacing="1.2">
    SYS://ABHIRAM_B_S.EXE
  </text>
  <text x="802" y="21.5" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#4DD0FF" letter-spacing="1">
    VVCE · CLASS 2029 · ONLINE
  </text>
  <line x1="16" y1="32" x2="804" y2="32" stroke="#17253B" stroke-width="1"/>

  <!-- PANEL 1 (Left): 2D Segmented Language Stats -->
  <g class="mono">
    <text x="20" y="51" font-size="9.5" font-weight="700" fill="#7DD3FC" letter-spacing="1">STAT // CORE ENGINE</text>

    <!-- C / C++ -->
    <text x="20" y="72" font-size="10" font-weight="700" fill="#E2E8F0">C/C++</text>
    <g transform="translate(80, 63)">
      <rect x="0"   y="0" width="14" height="9" fill="#04A2DC"/>
      <rect x="17"  y="0" width="14" height="9" fill="#04A2DC"/>
      <rect x="34"  y="0" width="14" height="9" fill="#4DD0FF"/>
      <rect x="51"  y="0" width="14" height="9" fill="#4DD0FF"/>
      <rect x="68"  y="0" width="14" height="9" fill="#0F5A76"/>
      <rect x="85"  y="0" width="14" height="9" fill="#0D1626" stroke="#17253B" stroke-width="0.8"/>
    </g>

    <!-- Python -->
    <text x="20" y="94" font-size="10" font-weight="700" fill="#E2E8F0">PYTHON</text>
    <g transform="translate(80, 85)">
      <rect x="0"   y="0" width="14" height="9" fill="#04A2DC"/>
      <rect x="17"  y="0" width="14" height="9" fill="#04A2DC"/>
      <rect x="34"  y="0" width="14" height="9" fill="#4DD0FF"/>
      <rect x="51"  y="0" width="14" height="9" fill="#4DD0FF"/>
      <rect x="68"  y="0" width="14" height="9" fill="#0F5A76"/>
      <rect x="85"  y="0" width="14" height="9" fill="#0D1626" stroke="#17253B" stroke-width="0.8"/>
    </g>

    <!-- Java -->
    <text x="20" y="116" font-size="10" font-weight="700" fill="#E2E8F0">JAVA</text>
    <g transform="translate(80, 107)">
      <rect x="0"   y="0" width="14" height="9" fill="#04A2DC"/>
      <rect x="17"  y="0" width="14" height="9" fill="#04A2DC"/>
      <rect x="34"  y="0" width="14" height="9" fill="#4DD0FF"/>
      <rect x="51"  y="0" width="14" height="9" fill="#0F5A76"/>
      <rect x="68"  y="0" width="14" height="9" fill="#0D1626" stroke="#17253B" stroke-width="0.8"/>
      <rect x="85"  y="0" width="14" height="9" fill="#0D1626" stroke="#17253B" stroke-width="0.8"/>
    </g>
  </g>

  <line x1="280" y1="42" x2="280" y2="132" stroke="#17253B" stroke-width="1"/>

  <!-- PANEL 2 (Center): Gamified Quest Progression (Strictly Clipped Inside Frame) -->
  <g class="mono">
    <text x="304" y="51" font-size="9.5" font-weight="700" fill="#7DD3FC" letter-spacing="1">LEVEL // CRAFT EVOLUTION</text>

    <!-- 2D Progress Track -->
    <rect x="304" y="70" width="212" height="8" rx="1.5" fill="#0D1626" stroke="#17253B" stroke-width="1"/>
    <g clip-path="url(#progClip)">
      <rect x="304" y="70" width="184" height="8" fill="url(#trackFill)"/>
      <rect x="304" y="70" width="24"  height="8" fill="#E0F7FF" opacity="0.55" class="scanner"/>
    </g>

    <!-- Crisp 2D Checkpoint Nodes -->
    <rect x="304" y="88" width="6" height="6" fill="#0F5A76"/>
    <text x="315" y="94" font-size="8.5" font-weight="700" fill="#94A3B8">VIBECODING</text>

    <rect x="444" y="88" width="6" height="6" fill="#4DD0FF"/>
    <text x="455" y="94" font-size="8.5" font-weight="700" fill="#4DD0FF">SPEC-DRIVEN</text>

    <text x="304" y="118" font-size="9.5" fill="#94A3B8">LEARN FROM SCRATCH · LAYER BY LAYER</text>
  </g>

  <line x1="544" y1="42" x2="544" y2="132" stroke="#17253B" stroke-width="1"/>

  <!-- PANEL 3 (Right): Player Identity & Co-op Status -->
  <g class="mono">
    <text x="564" y="51" font-size="9.5" font-weight="700" fill="#7DD3FC" letter-spacing="1">SESSION // TELEMETRY</text>

    <text x="564" y="72" font-size="10" fill="#64748B">PLAYER</text>
    <text x="632" y="72" font-size="10" font-weight="700" fill="#F8FAFC">Abhiram B S</text>

    <text x="564" y="92" font-size="10" fill="#64748B">TAG</text>
    <text x="632" y="92" font-size="10" font-weight="700" fill="#38BDF8">[ A_Ram ]</text>

    <text x="564" y="112" font-size="10" fill="#64748B">CO-OP</text>
    <text x="632" y="112" font-size="10" font-weight="700" fill="#E2E8F0">OPEN FOR IDEAS</text>

    <text x="564" y="131" font-size="9.5" fill="#7DD3FC">&gt;_ READY TO BUILD <tspan fill="#4DD0FF" class="cursor">█</tspan></text>
  </g>
</svg>
