<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 245" width="100%" role="img" aria-label="A_Ram Developer Telemetry Card">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#060A13"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFB400" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF3B8D" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="specBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3B8D"/>
      <stop offset="45%" stop-color="#FFB400"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <style><![CDATA[
      .mono { font-family: 'Courier New', Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.45; transform: scale(0.85); }
      }
      @keyframes irisSpin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes flowPulse {
        0%   { transform: translateX(-180px); opacity: 0; }
        25%  { opacity: 1; }
        80%  { opacity: 1; }
        100% { transform: translateX(180px); opacity: 0; }
      }
      .live-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseDot 2s ease-in-out infinite;
      }
      .aperture {
        transform-box: fill-box;
        transform-origin: center;
        animation: irisSpin 14s linear infinite;
      }
      .flow-glow {
        animation: flowPulse 3s ease-in-out infinite;
      }
    ]]></style>
  </defs>

  <!-- Main Card Frame -->
  <rect x="0" y="0" width="360" height="245" rx="12" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="358" height="243" rx="11" fill="none" stroke="url(#cardBorder)" stroke-width="1.4"/>

  <!-- Top Telemetry Header -->
  <circle cx="20" cy="20" r="4" fill="#22C55E" class="live-dot"/>
  <text x="31" y="24" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.2">A_Ram // PILOT SPEC</text>
  <text x="342" y="24" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#00E5FF">ONLINE</text>
  <line x1="14" y1="34" x2="346" y2="34" stroke="#1E293B" stroke-width="1"/>

  <!-- Quick Pilot Specs -->
  <g class="mono" font-size="10">
    <text x="16" y="54" fill="#64748B">NAME</text>
    <text x="108" y="54" fill="#F8FAFC" font-weight="700">Abhiram B S</text>

    <text x="16" y="74" fill="#64748B">CAMPUS</text>
    <text x="108" y="74" fill="#FFB400" font-weight="700">VVCE, Mysuru  ·  2029</text>

    <text x="16" y="94" fill="#64748B">CORE CODE</text>
    <text x="108" y="94" fill="#00E5FF" font-weight="700">C / C++ · Python · Java</text>
  </g>

  <line x1="14" y1="108" x2="346" y2="108" stroke="#1E293B" stroke-width="1"/>

  <!-- Journey Evolution Track -->
  <text x="16" y="126" class="mono" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="1">BUILD EVOLUTION</text>
  <rect x="16" y="135" width="328" height="8" rx="4" fill="#131C2E"/>
  <rect x="16" y="135" width="276" height="8" rx="4" fill="url(#specBar)"/>
  <circle cx="180" cy="139" r="3" fill="#FFFFFF" class="flow-glow"/>

  <g class="mono" font-size="8.5" font-weight="700">
    <text x="16"  y="157" fill="#FF6B9D">VIBECODING</text>
    <text x="172" y="157" text-anchor="middle" fill="#FFB400">FIRST PRINCIPLES</text>
    <text x="344" y="157" text-anchor="end" fill="#00E5FF">SPEC-DRIVEN</text>
  </g>

  <line x1="14" y1="170" x2="346" y2="170" stroke="#1E293B" stroke-width="1"/>

  <!-- Photography Shutter Widget -->
  <g transform="translate(32, 206)">
    <circle cx="0" cy="0" r="18" fill="#111827" stroke="#334155" stroke-width="1.4"/>
    <g class="aperture" stroke="#FFB400" stroke-width="1.3" fill="none" opacity="0.9">
      <line x1="-10" y1="-6" x2="10" y2="-6"/>
      <line x1="-10" y1="6"  x2="10" y2="6"/>
      <line x1="-12" y1="0"  x2="-2" y2="-11"/>
      <line x1="2"   y1="11" x2="12" y2="0"/>
      <line x1="-12" y1="0"  x2="-2" y2="11"/>
      <line x1="2"   y1="-11" x2="12" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="4.5" fill="#00E5FF"/>
  </g>

  <g class="mono">
    <text x="64" y="198" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="0.8">OFF-SCREEN // PHOTOGRAPHY</text>
    <text x="64" y="214" font-size="11.5" font-weight="700" fill="#F8FAFC">@fstop.manual</text>
    <text x="64" y="229" font-size="8.8" fill="#64748B">Chasing light, perspective &amp; stories</text>
  </g>
</svg>
