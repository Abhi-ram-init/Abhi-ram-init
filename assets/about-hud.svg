<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 132" width="100%" role="img" aria-label="Abhiram B S — Computer and Game HUD Telemetry">
  <defs>
    <!-- Single cohesive Midnight Asphalt + Forza Amber theme -->
    <linearGradient id="hudBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070C15"/>
      <stop offset="100%" stop-color="#04080F"/>
    </linearGradient>

    <!-- Single-hue Amber-Gold luminance progress bar -->
    <linearGradient id="amberBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6B4700"/>
      <stop offset="45%"  stop-color="#C98800"/>
      <stop offset="100%" stop-color="#FFB400"/>
    </linearGradient>

    <linearGradient id="amberEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFB400" stop-opacity="0.1"/>
      <stop offset="50%"  stop-color="#FFB400" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFB400" stop-opacity="0.1"/>
    </linearGradient>

    <style><![CDATA[
      .mono { font-family: 'Courier New', Consolas, monospace; }

      @keyframes sysPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.3; }
      }
      @keyframes cursorBlink {
        0%, 49%  { opacity: 1; }
        50%, 100%{ opacity: 0; }
      }
      @keyframes scanSweep {
        0%   { transform: translateX(0px); opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateX(465px); opacity: 0; }
      }

      .sys-dot   { animation: sysPulse 2s ease-in-out infinite; }
      .cursor    { animation: cursorBlink 1.1s step-end infinite; }
      .scan-glow { animation: scanSweep 3.4s ease-in-out infinite; }
    ]]></style>
  </defs>

  <!-- Terminal / HUD Frame -->
  <rect x="0" y="0" width="820" height="132" rx="10" fill="url(#hudBg)"/>
  <rect x="0.75" y="0.75" width="818.5" height="130.5" rx="9.5" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="1" y="1" width="818" height="2" rx="1" fill="url(#amberEdge)"/>

  <!-- Top Computer / Game HUD Status Bar -->
  <circle cx="20" cy="19" r="3.5" fill="#FFB400" class="sys-dot"/>
  <text x="31" y="22.5" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="1.2">
    SYS://PLAYER_HUD  —  ABHIRAM B S
  </text>
  <text x="802" y="22.5" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#FFB400" letter-spacing="1">
    STATUS: ONLINE  ·  VVCE 2029
  </text>
  <line x1="16" y1="33" x2="804" y2="33" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Spec Block: Computer System Metrics -->
  <g class="mono" font-size="10.5">
    <text x="18" y="54" fill="#64748B">PLAYER</text>
    <text x="96" y="54" fill="#F8FAFC" font-weight="700">Abhiram B S  [A_Ram]</text>

    <text x="18" y="74" fill="#64748B">ENGINE</text>
    <text x="96" y="74" fill="#FFB400" font-weight="700">C / C++  ·  Python  ·  Java</text>

    <text x="18" y="94" fill="#64748B">QUEST</text>
    <text x="96" y="94" fill="#CBD5E1">Learn from scratch · Build real systems</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="418" y1="42" x2="418" y2="118" stroke="#1E293B" stroke-width="1"/>

  <!-- Right Spec Block: Gamified Build Progression -->
  <g class="mono">
    <text x="436" y="54" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">
      LVL PROGRESSION // CURIOUS → ENGINEER
    </text>

    <!-- Single-Hue Amber Progress Track -->
    <rect x="436" y="65" width="366" height="10" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <rect x="436" y="65" width="318" height="10" rx="5" fill="url(#amberBar)"/>
    <rect x="436" y="66.5" width="18" height="7" rx="3.5" fill="#FFF2B2" opacity="0.85" class="scan-glow"/>

    <text x="436" y="91" font-size="9" font-weight="700" fill="#94A3B8">VIBECODING</text>
    <text x="615" y="91" text-anchor="middle" font-size="9" font-weight="700" fill="#E0A11B">FIRST PRINCIPLES</text>
    <text x="802" y="91" text-anchor="end" font-size="9" font-weight="700" fill="#FFB400">SPEC-DRIVEN</text>

    <text x="436" y="114" font-size="10" fill="#94A3B8">
      &gt;_ READY FOR INTERESTING IDEAS <tspan fill="#FFB400" font-weight="700" class="cursor">█</tspan>
    </text>
  </g>
</svg>
